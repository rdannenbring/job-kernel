MedTech, we are uniquely positioned to innovate across the full spectrum of healthcare solutions today to deliver the breakthroughs of tomorrow, and profoundly impact health for humanity. Learn more at jnj.com As guided by Our Credo, Johnson & Johnson is responsible to our employees who work with us throughout the world. We provide an inclusive work environment where each person is considered as an individual. At Johnson & Johnson, we respect the diversity and dignity of our employees and recognize their merit. Job Function Technology Enterprise Strategy & Security Job Sub Function Enterprise Architecture Job Category People Leader All Job Posting Locations: New Brunswick, New Jersey, United States of America, Palm Beach Gardens, Florida, United States of America, Raritan, New Jersey, United States of America, Warsaw, Indiana, United States of America, West Chester, Pennsylvania, United States of America Job Description DePuy Synthes is recruiting for a(n) Director, Chief Architect, Enterprise Architecture ; this Hybrid position will be in Raynham, MA (USA). Alternate Hybrid locations may be considered at Raritan, NJ (USA), West Chester, PA (USA), Warsaw, IN (USA), Palm Beach Gardens, FL (USA). Johnson & Johnson announced plans to separate our Orthopedics business to establish a standalone orthopedics company, operating as DePuy Synthes. The process of the planned separation is anticipated to be completed within 18 to 24 months, subject to legal requirements, including consultation with works councils and other employee representative bodies, as may be required, regulatory approvals and other customary conditions and approvals. Should you accept this position, it is anticipated that, following conclusion of the transaction, you would be an employee of DePuy Synthes and your employment would be governed by DePuy Synthes employment processes, programs, policies, and benefit plans. In that case, details of any planned changes would be provided to you by DePuy Synthes at an appropriate time and subject to any necessary consultation processes. Job Overview The Director, Chief Architect, Enterprise Architecture serves as the senior technology architecture leader for DePuy Synthes, defining and governing enterprise‑wide architecture strategy to enable business growth, innovation, scalability, and security. This role partners closely with business, IT, and digital leaders to ensure technology investments align to enterprise strategy and deliver measurable value. The role plays a critical leadership position during the evolution to a standalone DePuy Synthes organization, shaping future‑state architecture and enabling operational readiness and reports into the DePuy Synthes Technology organization. Key Responsibilities Define and own the enterprise architecture vision, principles, standards, and roadmaps aligned to DePuy Synthes business strategy and IT priorities. Lead architecture governance across applications, data, integration, infrastructure, and security to ensure consistency, scalability, and compliance. Partner with business and technology leaders to translate business capabilities and strategies into target‑state enterprise and solution architectures. Guide major technology programs and investments, providing architectural direction, design oversight, and risk mitigation for complex initiatives. Establish and maintain architecture standards, reference architectures, and patterns to accelerate delivery and reduce technical debt. Lead, mentor, and develop enterprise and solution architects, fostering a strong architecture community and culture of collaboration. Evaluate emerging technologies and industry trends to inform strategic recommendations and innovation opportunities. Ensure enterprise architecture supports regulatory, quality, privacy, and cybersecurity requirements relevant to the MedTech environment. Qualifications Education Required: Bachelor’s degree in Computer Science, Information Systems, Engineering, or a related field. Preferred: Master’s degree (MS or MBA) with a focus on technology, business strategy, or systems architecture. Required Experience and Skills: 10-12 years of progressive experience in enterprise architecture, solution architecture, or related technology leadership roles. Demonstrated experience defining enterprise‑wide architecture strategies and leading architecture governance at scale. Strong understanding of application, data, integration, cloud, and infrastructure architectures. Experience leading and developing high‑performing architecture teams. Strong communication and executive‑level presentation skills. Preferred Experience supporting large‑scale transformations, separations, or operating‑model changes. Background in MedTech, regulated industries, or global enterprise environments. Hands‑on experience with cloud platforms, digital platforms, and modern integration patterns. Familiarity with architecture frameworks (e.g., TOGAF or equivalent). Proven ability to partner with senior business and IT leaders to drive alignment and outcomes. Other Language: English (required). Travel: Up to 15% domestic and international. Certifications: Enterprise Architecture or cloud certifications (preferred). For more information on how we support the whole health of our employees throughout their wellness, career and life journey, please visit www.careers.jnj.com. Johnson & Johnson is an Equal Opportunity Employer. All qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender identity, age, national origin, disability, protected veteran status or other characteristics protected by federal, state or local law. We actively seek qualified candidates who are protected veterans and individuals with disabilities as defined under VEVRAA and Section 503 of the Rehabilitation Act. Johnson & Johnson is committed to providing an interview process that is inclusive of our applicants’ needs. If you a