version: '3.9'

# ── JobApplicationAutomator — Production Docker Compose ───────────────────────
#
# Quick start:
#   1. cp backend/.env.example backend/.env  && edit it
#   2. cp .env.example .env                  && edit it (ports, etc.)
#   3. docker compose up -d --build
#   4. Open http://localhost
#
# PostgreSQL (optional):
#   docker compose --profile postgres up -d --build
#
# Development (hot-reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Port is NOT exposed publicly — Nginx proxies /api/* to this service.
    # To expose for local debugging, use docker-compose.dev.yml override.
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      # SQLite stored in the named volume (default).
      # Switch to Postgres by setting DATABASE_URL in the root .env.
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/applications.db}
      - DOCUMENTS_STORAGE_PATH=/data
      # Required for OnlyOffice callbacks — must be reachable from the
      # OnlyOffice container via the internal Docker network.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
    volumes:
      - app_data:/data
      # Optional: mount a local documents folder (configure in root .env)
      # - ${DOCUMENTS_HOST_PATH}:/mnt/documents:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
        required: false  # Only required when using --profile postgres

  # ── Frontend (Nginx + React) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Leave VITE_API_URL empty — Nginx proxies /api/* to the backend,
        # so the frontend uses relative URLs and needs no explicit host.
        VITE_API_URL: ${VITE_API_URL:-}
        # OnlyOffice must be reachable from the USER'S BROWSER.
        # Set this to your server's IP/domain if not running locally.
        VITE_ONLYOFFICE_URL: ${VITE_ONLYOFFICE_URL:-http://localhost:8443}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

  # ── OnlyOffice Document Server ──────────────────────────────────────────────
  # Used for in-browser resume editing. Must be accessible from the browser.
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-8443}:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    volumes:
      - onlyoffice_data:/var/lib/onlyoffice

  # ── PostgreSQL (optional) ───────────────────────────────────────────────────
  # Activate with: docker compose --profile postgres up
  # Also set DATABASE_URL in the root .env to point to this service.
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-jobapp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  app_data:         # SQLite database, uploads, and generated outputs
  onlyoffice_data:  # OnlyOffice document server state
  postgres_data:    # PostgreSQL data (only used with --profile postgres)
