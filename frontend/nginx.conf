server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── React Router: all unknown paths fall back to index.html ───────────────
    # index.html must never be cached — it holds the hashed asset filenames
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy all /api/* calls to the backend ─────────────────────────────────
    # The backend is accessed via the internal Docker network — never exposed
    # publicly. This eliminates CORS and keeps the architecture clean.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large file uploads (resumes, documents)
        client_max_body_size 50M;

        # Longer timeout for AI operations
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Static file caching ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
}
