; Minimal mypy config for the Applied stage. Production code (services,
; models, routes, jobs) stays at full --strict; test code relaxes the
; "annotate every function and fixture" requirements that don't add value
; in pytest, plus SQLAlchemy's Column[int] descriptor noise.
[mypy]
strict = True
follow_imports = silent
warn_unused_ignores = True

[mypy-tests.applied.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
; Column[int] vs int at instance access (SQLAlchemy 1.x typing gap).
disable_error_code = arg-type
